spring:
  application:
    name: certimaster

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:certimaster}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:29092}
    consumer:
      group-id: certimaster
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.certimaster.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:604800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  issuer: ${JWT_ISSUER:certimaster}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    domain: ${AUTH_COOKIE_DOMAIN:}
  oauth2:
    redirect-allowlist: ${AUTH_OAUTH2_REDIRECT_ALLOWLIST:http://localhost:3000,https://certimaster.com}
    callback-base-url: ${AUTH_OAUTH2_CALLBACK_BASE_URL:http://localhost:8080/api/v1/auth/oauth/callback}
    google:
      client-id: ${AUTH_OAUTH2_GOOGLE_CLIENT_ID:807716176451-t92m5cd4bvdcmrt86j7p63seojh4pst4.apps.googleusercontent.com}
      client-secret: ${AUTH_OAUTH2_GOOGLE_CLIENT_SECRET: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}
      authorize-url: ${AUTH_OAUTH2_GOOGLE_AUTHORIZE_URL:https://accounts.google.com/o/oauth2/v2/auth}
      token-url: ${AUTH_OAUTH2_GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
      user-info-url: ${AUTH_OAUTH2_GOOGLE_USER_INFO_URL:https://openidconnect.googleapis.com/v1/userinfo}
      scope: ${AUTH_OAUTH2_GOOGLE_SCOPE:openid profile email}
    github:
      client-id: ${AUTH_OAUTH2_GITHUB_CLIENT_ID:Ov23lisKqOUQvBdv8Qf5}
      client-secret: ${AUTH_OAUTH2_GITHUB_CLIENT_SECRET:24d76402c3a99ef972210c4bbe848819e0995b94}
      authorize-url: ${AUTH_OAUTH2_GITHUB_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
      token-url: ${AUTH_OAUTH2_GITHUB_TOKEN_URL:https://github.com/login/oauth/access_token}
      user-info-url: ${AUTH_OAUTH2_GITHUB_USER_INFO_URL:https://api.github.com/user}
      user-emails-url: ${AUTH_OAUTH2_GITHUB_USER_EMAILS_URL:https://api.github.com/user/emails}
      scope: ${AUTH_OAUTH2_GITHUB_SCOPE:read:user user:email}
  admin:
    bulk:
      max-size: ${AUTH_ADMIN_BULK_MAX_SIZE:500}
  session:
    ttl-seconds: ${AUTH_SESSION_TTL_SECONDS:86400}
    cleanup:
      enabled: ${AUTH_SESSION_CLEANUP_ENABLED:true}
      interval-ms: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:3600000}
  password-reset:
    token-expiration-minutes: ${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    avatar: ${MINIO_BUCKET_AVATAR:avatars}

exam:
  session:
    max-concurrent: ${EXAM_SESSION_MAX_CONCURRENT:3}
    auto-expire-enabled: ${EXAM_SESSION_AUTO_EXPIRE_ENABLED:true}
    auto-expire-check-interval-ms: ${EXAM_SESSION_AUTO_EXPIRE_CHECK_INTERVAL_MS:60000}

api:
  version: v1

app:
  domain: ${APP_DOMAIN:certimaster}
  service: ${APP_SERVICE:certimaster}
  exception:
    include-stack-trace: ${APP_EXCEPTION_INCLUDE_STACK_TRACE:false}
    log-stack-trace: ${APP_EXCEPTION_LOG_STACK_TRACE:true}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://certimaster.com}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-User-Id,X-Requested-With,Accept,Origin}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,X-User-Id}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  logging:
    export:
      otlp:
        enabled: ${OTEL_LOGS_EXPORT_ENABLED:false}
  tracing:
    export:
      enabled: ${TRACING_EXPORT_ENABLED:${TRACING_ENABLED:false}}
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:${TRACING_ENABLED:false}}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:${OTEL_ENDPOINT:http://localhost:4318/v1/traces}}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.certimaster: ${LOG_LEVEL_CERTIMASTER:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
